tools:
    shell:
        allow:
            - cd *
            - git status *
            - echo *
            - git diff *
            - ls *
            - head *
            - grep *
            - .venv/bin/python *
            - sed *
            - git show *
            - tail *
            - printf *
            - find *
            - cat *
            - git check-ignore *
            - git ls-files *
